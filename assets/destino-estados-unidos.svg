<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="Composição editorial de viagem urbana para os Estados Unidos">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aeeeff"/>
      <stop offset="0.55" stop-color="#f4faff"/>
      <stop offset="1" stop-color="#d7efff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087bea"/>
