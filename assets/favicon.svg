<svg xmlns="http://www.w3.org/2000/svg" viewBox="72 92 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Favicon Seguro Simples</title>
  <desc id="desc">Favicon em tons de azul com olho grego, escudo e avião, representando proteção e seguro viagem.</desc>
  <defs>
    <linearGradient id="shieldGradient" x1="130" y1="110" x2="610" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1296F3"/>
      <stop offset="0.45" stop-color="#064FC4"/>
      <stop offset="1" stop-color="#022B84"/>
    </linearGradient>
    <linearGradient id="ringBlue" x1="220" y1="205" x2="560" y2="565" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B7BFF"/>
